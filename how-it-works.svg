<svg width="680" viewBox="0 0 680 330" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>How Logbook works</title><desc>Life sources flow into one logbook folder, which recounts itself as days, and a day can be shared with a chosen person who shares one back.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"><rect x="40" y="60" width="138" height="36" rx="8"/><rect x="40" y="106" width="138" height="36" rx="8"/><rect x="40" y="152" width="138" height="36" rx="8"/><rect x="40" y="198" width="138" height="36" rx="8"/></g>
<g fill="#444441" font-size="14" font-weight="500" text-anchor="middle"><text x="109" y="83">Location</text><text x="109" y="129">Photos</text><text x="109" y="175">Calendar</text><text x="109" y="221">Messages</text></g>
<g stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"><line x1="178" y1="78" x2="194" y2="78"/><line x1="178" y1="124" x2="194" y2="124"/><line x1="178" y1="170" x2="194" y2="170"/><line x1="178" y1="216" x2="194" y2="216"/><line x1="332" y1="147" x2="348" y2="147"/><line x1="486" y1="132" x2="502" y2="132"/><line x1="502" y1="162" x2="486" y2="162"/></g>
<rect x="194" y="60" width="138" height="174" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="263" y="125" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">Logbook</text>
<g text-anchor="middle" font-size="12" fill="#534AB7"><text x="263" y="147">one folder, yours</text><text x="263" y="165">written once</text><text x="263" y="183">never edited</text></g>
<rect x="348" y="60" width="138" height="174" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="417" y="125" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">Days</text>
<g text-anchor="middle" font-size="12" fill="#0F6E56"><text x="417" y="147">a page per day</text><text x="417" y="165">trips, people</text><text x="417" y="183">decisions</text></g>
<rect x="502" y="60" width="138" height="174" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="571" y="125" text-anchor="middle" font-size="14" font-weight="500" fill="#712B13">Your circle</text>
<g text-anchor="middle" font-size="12" fill="#993C1D"><text x="571" y="147">people you choose</text><text x="571" y="165">a page for a page</text><text x="571" y="183">their own logbook</text></g>
<rect x="40" y="262" width="600" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="286" text-anchor="middle" font-size="12" fill="#444441">Reveal, never reward · nothing leaves without a name · it's just files</text>
</svg>
