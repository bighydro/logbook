name: ci
on:
  push: { branches: [main] }
  pull_request:
  schedule:
    - cron: "17 4 * * 1"   # weekly scorecard
permissions: { contents: read }
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --group dev
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy logbook
      - run: uv run pytest --cov=logbook --cov-report=xml
      - name: conformance
        run: uv run logbook verify --root conformance/sample-logbook --expect conformance/expected.json
      - uses: codecov/codecov-action@v7
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - run: nix build --print-build-logs
      - run: result/bin/logbook --version
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: build linux/amd64 and linux/arm64 (no push)
        uses: docker/build-push-action@v7
        with: { context: ., platforms: "linux/amd64,linux/arm64", push: false, cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - name: load amd64 image
        uses: docker/build-push-action@v7
        with: { context: ., platforms: linux/amd64, load: true, tags: logbook:amd64, cache-from: type=gha }
      - run: docker run --rm logbook:amd64 --version
      - name: load arm64 image
        uses: docker/build-push-action@v7
        with: { context: ., platforms: linux/arm64, load: true, tags: logbook:arm64, cache-from: type=gha }
      - run: docker run --rm --platform linux/arm64 logbook:arm64 --version
  scorecard:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { security-events: write, id-token: write }
    steps:
      - uses: actions/checkout@v7
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with: { results_file: results.sarif, results_format: sarif, publish_results: true }
      - uses: github/codeql-action/upload-sarif@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3.38.1
        with: { sarif_file: results.sarif }
