name: ci
on:
  push: { branches: [main] }
  pull_request:
  schedule:
    - cron: "17 4 * * 1"   # weekly scorecard
    - cron: "23 3 * * *"   # nightly: the whole matrix with the slow tier
permissions: { contents: read }
jobs:
  test:
    # The six `test (<os>, <python>)` checks are required by name on main; never rename the job or an entry.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      # `slow` tests (over about five seconds, tests/conftest.py) run on push to main and nightly, not on
      # a pull request; `stress` tests (millions of lines, timing and memory assertions) never run in CI.
      LOGBOOK_SLOW: ${{ github.event_name != 'pull_request' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: py${{ matrix.python }}   # one cache per interpreter, so the two entries on an OS never evict each other
      - run: uv sync --group dev
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy logbook
      - run: uv run pytest -n auto --durations=15 --cov=logbook --cov-report=xml
      - name: conformance
        run: uv run logbook verify --root conformance/sample-logbook --expect conformance/expected.json
      - uses: codecov/codecov-action@v7
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - run: nix build --print-build-logs
      - run: result/bin/logbook --version
  homebrew:
    # The formula in homebrew/ builds on a Mac the way a user's `brew install bighydro/logbook/logbook`
    # does: Homebrew installs only from a tap, so the file goes into a throwaway local one, is
    # built from source, then its test block runs, then the audit. The file published to the tap
    # bighydro/homebrew-logbook is this one (homebrew/README.md). Separate from the test matrix.
    runs-on: macos-latest
    env: { HOMEBREW_NO_AUTO_UPDATE: "1", HOMEBREW_NO_INSTALL_CLEANUP: "1", HOMEBREW_NO_ENV_HINTS: "1" }
    steps:
      - uses: actions/checkout@v7
      - name: the formula, in a local tap
        run: |
          brew tap-new --no-git local/logbook
          cp homebrew/logbook.rb "$(brew --repository local/logbook)/Formula/logbook.rb"
      - run: brew install --build-from-source --verbose local/logbook/logbook
      - run: logbook --version
      - run: brew test --verbose local/logbook/logbook
      - run: brew audit --strict --online local/logbook/logbook
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: build linux/amd64 and linux/arm64 (no push)
        uses: docker/build-push-action@v7
        with: { context: ., platforms: "linux/amd64,linux/arm64", push: false, cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - name: load amd64 image
        uses: docker/build-push-action@v7
        with: { context: ., platforms: linux/amd64, load: true, tags: logbook:amd64, cache-from: type=gha }
      - run: docker run --rm logbook:amd64 --version
      - name: load arm64 image
        uses: docker/build-push-action@v7
        with: { context: ., platforms: linux/arm64, load: true, tags: logbook:arm64, cache-from: type=gha }
      - run: docker run --rm --platform linux/arm64 logbook:arm64 --version
  cross-impl:
    # The independent TypeScript implementation (bighydro/logbook-ts, written from SPEC.md alone) must
    # agree with this one: on the conformance sample, and on a record the other implementation wrote.
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: check out logbook-ts at main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { repository: bighydro/logbook-ts, ref: main, path: logbook-ts }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { package_json_file: logbook-ts/package.json }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "22", cache: pnpm, cache-dependency-path: logbook-ts/pnpm-lock.yaml }
      - name: build logbook-ts
        working-directory: logbook-ts
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uv sync
      - name: logbook-ts verify prints the head in conformance/expected.json
        run: |
          set -euo pipefail
          expected=$(jq -r .head conformance/expected.json)
          out=$(node logbook-ts/dist/bin.js verify conformance/sample-logbook)
          echo "$out"
          got=${out##*head }
          if [ "$got" != "$expected" ]; then
            echo "::error::logbook-ts and conformance/expected.json disagree on the head of conformance/sample-logbook"
            echo "  expected (conformance/expected.json): $expected"
            echo "  got      (logbook-ts verify):         $got"
            exit 1
          fi
      - name: a note appended by the Python CLI verifies with the TypeScript CLI
        env: { LOGBOOK_HOME: "${{ runner.temp }}/sample-copy" }
        run: |
          set -euo pipefail
          cp -R conformance/sample-logbook "$LOGBOOK_HOME"
          uv run logbook add "written by the Python implementation, verified by the TypeScript one"
          py=$(uv run logbook verify --root "$LOGBOOK_HOME" | head -n 1)
          ts=$(node logbook-ts/dist/bin.js verify "$LOGBOOK_HOME")
          echo "python:     $py"
          echo "typescript: $ts"
          lines=$(( $(jq -r .seq conformance/expected.json) + 1 ))
          want="valid — ${lines} lines, head ${py##*head }"
          if [ "$ts" != "$want" ]; then
            echo "::error::logbook-ts does not accept the record the Python implementation wrote"
            echo "  python verify:     $py"
            echo "  typescript verify: $ts"
            echo "  wanted:            $want"
            exit 1
          fi
  scorecard:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { security-events: write, id-token: write }
    steps:
      - uses: actions/checkout@v7
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with: { results_file: results.sarif, results_format: sarif, publish_results: true }
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with: { sarif_file: results.sarif }
