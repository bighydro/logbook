name: docs
on:
  push:
    branches: [main]
    paths: ["**.md", "mkdocs.yml", "docs/**", ".github/workflows/docs.yml"]
  workflow_dispatch:
permissions: { contents: write }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - name: Commit to gh-pages as github-actions[bot], never the runner identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: uvx --with mkdocs-material --with pymdown-extensions mkdocs gh-deploy --force --no-history
