name: changelog
# Every pull request adds a fragment under changelog.d/ and leaves CHANGELOG.md alone, which is assembled
# at release time (CONTRIBUTING.md, docs/releasing.md). The `no-changelog` label opts a pull request out:
# the release itself, or a change with nothing to tell the user. Labelling re-runs the check.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
permissions: { contents: read }
jobs:
  fragment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 2 }   # the merge commit and both parents: HEAD^1 is the base, HEAD the PR merged
      - name: CHANGELOG.md untouched and a fragment under changelog.d/ added or changed
        env:
          OPTED_OUT: ${{ contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
        run: |
          set -euo pipefail
          if [ "$OPTED_OUT" = true ]; then
            echo "::notice::labelled no-changelog; not checking for a fragment"
            exit 0
          fi
          if git diff --name-only HEAD^1 HEAD | grep -qx 'CHANGELOG.md'; then
            echo "::error file=CHANGELOG.md::CHANGELOG.md is assembled at release time; add changelog.d/<short-slug>.md instead (CONTRIBUTING.md), or label the pull request no-changelog"
            exit 1
          fi
          fragments=$(git diff --name-only --diff-filter=AM HEAD^1 HEAD -- 'changelog.d/*.md' ':!changelog.d/README.md')
          if [ -z "$fragments" ]; then
            echo "::error::no changelog fragment: add changelog.d/<short-slug>.md (one or a few '- ' lines in CHANGELOG.md's wording, see changelog.d/README.md), or label the pull request no-changelog"
            exit 1
          fi
          echo "fragment(s):"
          echo "$fragments"
          # A fragment that would stop the release is caught here, not at release time.
          python3 scripts/changelog_assemble.py 0.0.0 --dry-run > /dev/null
