name: Bug
description: Something the CLI, a reader or an adapter does wrong, with a synthetic reproduction.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Nothing real enters an issue: no line from your record, no export, no screenshot of one, no name, number or address. Reproduce it on the demo record (`logbook demo --out /tmp/demo`) or on a fixture you invent with the sample person from `docs/try-it.md`. A reproduction that needs your own data is a reproduction the maintainers cannot run.
  - type: input
    id: version
    attributes:
      label: Version and platform
      description: The output of `logbook --version`, and the OS and Python version.
      placeholder: logbook 0.5.0, macOS 15.6, Python 3.12.6
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: The exact commands, from an empty folder, that show the problem. Start from `logbook demo` or from a fixture written out in the issue.
      render: bash
      placeholder: |
        logbook demo --out /tmp/demo --days 28 --seed 7
        export LOGBOOK_HOME=/tmp/demo
        logbook day 2026-06-17
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What the spec, a docs page or common sense says should have happened. Cite the section when there is one.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: The output, verbatim, with any traceback. Check it once more for anything personal before pasting.
      render: text
    validations:
      required: true
  - type: checkboxes
    id: hygiene
    attributes:
      label: Hygiene
      options:
        - label: Everything above is synthetic; nothing in it comes from a real record or export.
          required: true
        - label: I ran `logbook verify` and the chain is intact, or the bug is that it is not.
          required: false
