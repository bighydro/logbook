repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks: [{ id: ruff-check, args: [--fix] }, { id: ruff-format }]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - { id: no-commit-to-branch, args: [--branch, main] }
      # docs/ mirrors the top-level pages as git symlinks (mode 120000). A checkout with
      # core.symlinks=false writes each as a plain file holding its target, "../SPEC.md" with no
      # newline, and these two hooks would then append one and break the link for every other
      # checkout (the docs site builds from the symlinks). The ADRs under docs/adr/ are real files.
      # A shared-page fixture's attachment is a blob named by its digest: one appended byte breaks it.
      - { id: end-of-file-fixer, exclude: &mirror '^(?:docs/(?:[^/]+|adapters/README|conformance/README|rfcs/[^/]+)\.md|tests/fixtures/share/.*/attachments/.*)$' }
      - { id: trailing-whitespace, exclude: *mirror }
      - { id: check-json }
      # mkdocs.yml carries a `!!python/name:` tag (the Mermaid fence); --unsafe parses the syntax
      # without constructing the tag, which is what pre-commit-hooks documents for such files.
      - { id: check-yaml, args: [--unsafe] }
      - { id: detect-private-key }
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks: [{ id: gitleaks }]
  - repo: local
    hooks:
      # Reads the staged diff, or the range `pre-commit run --from-ref A --to-ref B` names, and ends
      # with one line of counts: `verbose` shows that line on a pass too, so "checked nothing" (no
      # patterns file, no lines) is never a silent Passed; `require_serial` keeps it to one run, one line.
      - id: check-pii
        name: check added lines for personal identifiers
        entry: python scripts/check_pii.py
        language: python
        pass_filenames: true
        require_serial: true
        verbose: true
        stages: [pre-commit]
