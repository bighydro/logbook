repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks: [{ id: ruff, args: [--fix] }, { id: ruff-format }]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks: [{ id: no-commit-to-branch, args: [--branch, main] }, { id: end-of-file-fixer }, { id: trailing-whitespace }, { id: check-json }, { id: check-yaml }, { id: detect-private-key }]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks: [{ id: gitleaks }]
  - repo: local
    hooks:
      - id: check-pii
        name: check staged diff for personal identifiers
        entry: python scripts/check_pii.py
        language: python
        pass_filenames: true
        stages: [pre-commit]
