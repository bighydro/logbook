[project]
name = "openlogbook"           # the PyPI package; the command is still `logbook`
version = "0.5.0"
description = "A diary that writes itself. Your life, in a folder."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "bighydro" }]
keywords = ["lifelog", "diary", "logbook", "append-only", "hash-chain", "local-first", "personal-data"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Database",
  "Typing :: Typed",
]
dependencies = [
    "ijson>=3.3",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
encrypted = ["cryptography>=42"]  # `openlogbook[encrypted]`: import-backup on an encrypted iOS backup
ais = ["websockets>=13"]          # `openlogbook[ais]`: sync ais listens to aisstream.io's websocket
# `openlogbook[transcribe]`: transcribe voice-memos, locally; mlx-whisper on Apple silicon, faster-whisper elsewhere
transcribe = [
  "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "faster-whisper>=1.0; sys_platform != 'darwin' or platform_machine != 'arm64'",
]
# `openlogbook[judge]`: `promises --judge` reads each candidate with a local instruct model, mlx-lm on Apple silicon
judge = ["mlx-lm>=0.20; sys_platform == 'darwin' and platform_machine == 'arm64'"]
mcp = ["mcp>=2"]  # `openlogbook[mcp]`: `logbook mcp` serves the record to an MCP host over stdio

[project.urls]
Homepage = "https://github.com/bighydro/logbook"
Specification = "https://github.com/bighydro/logbook/blob/main/SPEC.md"
Changelog = "https://github.com/bighydro/logbook/blob/main/CHANGELOG.md"

[project.scripts]
logbook = "logbook.cli:main"

[project.entry-points."logbook.adapters"]
ios-contacts = "logbook.adapters.ios_contacts"
whatsapp = "logbook.adapters.whatsapp"
whatsapp-contacts = "logbook.adapters.whatsapp_contacts"
imessage = "logbook.adapters.imessage"
ios-notes = "logbook.adapters.ios_notes"
ios-calendar = "logbook.adapters.ios_calendar"
apple-health = "logbook.adapters.apple_health"
ics = "logbook.adapters.ics"
flighty = "logbook.adapters.flighty"
transcript = "logbook.adapters.transcript"
granola = "logbook.adapters.granola"
mail = "logbook.adapters.mail"
safari = "logbook.adapters.safari"
shazam = "logbook.adapters.shazam"
apple-podcasts = "logbook.adapters.apple_podcasts"
pocket = "logbook.adapters.pocket"
apple-books = "logbook.adapters.apple_books"
voice-memos = "logbook.adapters.voice_memos"
apple-photos = "logbook.adapters.apple_photos"
withings = "logbook.adapters.withings"
myfitnesspal = "logbook.adapters.myfitnesspal"
sbb = "logbook.adapters.sbb"

[dependency-groups]
dev = [
  "pre-commit>=4",
  "pytest>=8",
  "hypothesis>=6.168.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest-cov>=5",
  "jsonschema>=4",
  "cryptography>=42",  # the `encrypted` extra, so its tests and mypy see it
  "websockets>=13",  # the `ais` extra, so mypy sees it (the tests fake the socket)
  "mcp>=2",  # the `mcp` extra, so its tests run and mypy sees it (an in-process client, no socket)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["logbook"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
allowed-confusables = ["×"]  # `×N sources`: a calendar entry several sources carry

[tool.mypy]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
module = "ijson"
ignore_missing_imports = true  # no py.typed, no stubs

[[tool.mypy.overrides]]
module = ["mlx_whisper.*", "faster_whisper.*", "huggingface_hub.*", "mlx_lm.*"]
ignore_missing_imports = true  # the `transcribe` and `judge` extras, imported only when the command runs

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: generated stress tests; run with LOGBOOK_SLOW=1"]
