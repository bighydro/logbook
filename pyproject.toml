[project]
name = "logbook-cli"            # "logbook" on PyPI belongs to an unrelated logging library
version = "0.1.0"
description = "A diary that writes itself. Your life, in a folder."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "bighydro" }]
keywords = ["lifelog", "diary", "logbook", "append-only", "hash-chain", "local-first", "personal-data"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Database",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/bighydro/logbook"
Specification = "https://github.com/bighydro/logbook/blob/main/SPEC.md"
Changelog = "https://github.com/bighydro/logbook/blob/main/CHANGELOG.md"

[project.scripts]
logbook = "logbook.cli:main"

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.6", "mypy>=1.11", "pytest-cov>=5", "jsonschema>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["logbook"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
