[project]
name = "openlogbook"           # the PyPI package; the command is still `logbook`
version = "0.3.0"
description = "A diary that writes itself. Your life, in a folder."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "bighydro" }]
keywords = ["lifelog", "diary", "logbook", "append-only", "hash-chain", "local-first", "personal-data"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Database",
  "Typing :: Typed",
]
dependencies = [
    "ijson>=3.3",
    "tzdata; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/bighydro/logbook"
Specification = "https://github.com/bighydro/logbook/blob/main/SPEC.md"
Changelog = "https://github.com/bighydro/logbook/blob/main/CHANGELOG.md"

[project.scripts]
logbook = "logbook.cli:main"

[project.entry-points."logbook.adapters"]
ios-contacts = "logbook.adapters.ios_contacts"
whatsapp = "logbook.adapters.whatsapp"

[dependency-groups]
dev = ["pre-commit>=4", "pytest>=8", "hypothesis>=6.168.0", "ruff>=0.6", "mypy>=1.11", "pytest-cov>=5", "jsonschema>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["logbook"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
module = "ijson"
ignore_missing_imports = true  # no py.typed, no stubs

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: generated stress tests; run with LOGBOOK_SLOW=1"]
