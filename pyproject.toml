[project]
name = "openlogbook"           # the PyPI package; the command is still `logbook`
version = "0.6.1"
description = "A diary that writes itself. Your life, in a folder."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "bighydro" }]
keywords = ["lifelog", "diary", "logbook", "append-only", "hash-chain", "local-first", "personal-data"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Database",
  "Typing :: Typed",
]
dependencies = [
    "tzdata; sys_platform == 'win32'",  # zoneinfo needs a zone database Windows does not ship
]

[project.optional-dependencies]
# `openlogbook[crypto]`: import-backup on an encrypted iOS backup; share and receive a signed page (Ed25519)
crypto = ["cryptography>=42"]
sealed = ["pyrage>=1.2"]          # `openlogbook[sealed]`: tiers 2–3 sealed at rest with age (SPEC §4, RFC 0029)
# `openlogbook[stream]`: ijson, streaming JSON, for the five adapters that read a multi-gigabyte export
# (dawarich, spotify, google-takeout-location, -activity, -youtube). Imported when such a file is read;
# without it `logbook add` names this extra and exits 2, and nothing else is affected.
stream = ["ijson>=3.3"]
ais = ["websockets>=13"]          # `openlogbook[ais]`: sync ais listens to aisstream.io's websocket
# `openlogbook[transcribe]`: transcribe voice-memos, locally; mlx-whisper on Apple silicon, faster-whisper elsewhere
transcribe = [
  "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "faster-whisper>=1.0; sys_platform != 'darwin' or platform_machine != 'arm64'",
]
# `openlogbook[judge]`: `promises --judge` reads each candidate with a local instruct model, mlx-lm on Apple silicon
judge = ["mlx-lm>=0.20; sys_platform == 'darwin' and platform_machine == 'arm64'"]
# `openlogbook[describe]`: `describe keepers` looks at each keeper's photo with a local vision model, mlx-vlm on Apple silicon;
# pillow-heif opens the HEIC originals a phone takes
describe = [
  "mlx-vlm>=0.1.20; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "pillow-heif>=0.18; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
mcp = ["mcp>=2"]  # `openlogbook[mcp]`: `logbook mcp` serves the record to an MCP host over stdio

[project.urls]
Homepage = "https://github.com/bighydro/logbook"
Specification = "https://github.com/bighydro/logbook/blob/main/SPEC.md"
Changelog = "https://github.com/bighydro/logbook/blob/main/CHANGELOG.md"
Documentation = "https://bighydro.github.io/logbook/"
Issues = "https://github.com/bighydro/logbook/issues"

[project.scripts]
logbook = "logbook.cli:main"

# The adapter registry (ARCHITECTURE layer 2, ADR 0012): every built-in adapter module, in the order
# `logbook.adapters.find` tries them on a file. `logbook.adapters.all_adapters()` reads this group,
# a third-party adapter registers under it too, and tests/test_adapter_registry.py checks this table
# against the modules under logbook/adapters/ and against what the installed package reports.
[project.entry-points."logbook.adapters"]
dawarich = "logbook.contrib.adapters.dawarich"
immich = "logbook.contrib.adapters.immich"
dawarich-live = "logbook.contrib.adapters.dawarich_live"
takeout-location = "logbook.contrib.adapters.takeout.location"
takeout-photos = "logbook.contrib.adapters.takeout.photos"
takeout-keep = "logbook.contrib.adapters.takeout.keep"
takeout-tasks = "logbook.contrib.adapters.takeout.tasks"
takeout-chrome = "logbook.contrib.adapters.takeout.chrome"
takeout-youtube = "logbook.contrib.adapters.takeout.youtube"
takeout-pay = "logbook.contrib.adapters.takeout.pay"
takeout-chat = "logbook.contrib.adapters.takeout.chat"
takeout-meet = "logbook.contrib.adapters.takeout.meet"
takeout-access-log = "logbook.contrib.adapters.takeout.access_log"
takeout-activity = "logbook.contrib.adapters.takeout.activity"
takeout-contacts = "logbook.contrib.adapters.takeout.contacts"
takeout-maps = "logbook.contrib.adapters.takeout.maps"
takeout-home = "logbook.contrib.adapters.takeout.home"
takeout-fit = "logbook.contrib.adapters.takeout.fit"
ios-contacts = "logbook.contrib.adapters.ios_contacts"
whatsapp = "logbook.contrib.adapters.whatsapp"
whatsapp-contacts = "logbook.contrib.adapters.whatsapp_contacts"
imessage = "logbook.contrib.adapters.imessage"
imessage-live = "logbook.contrib.adapters.imessage_live"
ios-notes = "logbook.contrib.adapters.ios_notes"
ios-calendar = "logbook.contrib.adapters.ios_calendar"
ios-calls = "logbook.contrib.adapters.ios_calls"
apple-wallet = "logbook.contrib.adapters.apple_wallet"
easypark = "logbook.contrib.adapters.easypark"
wispr-flow = "logbook.contrib.adapters.wispr_flow"
flighty = "logbook.contrib.adapters.flighty"
apple-health = "logbook.contrib.adapters.apple_health"
ics = "logbook.contrib.adapters.ics"
transcript = "logbook.contrib.adapters.transcript"
granola = "logbook.contrib.adapters.granola"
gcal = "logbook.contrib.adapters.gcal"
ais = "logbook.contrib.adapters.ais"
adsb = "logbook.contrib.adapters.adsb"
mail = "logbook.contrib.adapters.mail"
safari = "logbook.contrib.adapters.safari"
shazam = "logbook.contrib.adapters.shazam"
apple-podcasts = "logbook.contrib.adapters.apple_podcasts"
pocket = "logbook.contrib.adapters.pocket"
apple-reminders = "logbook.contrib.adapters.apple_reminders"
copilot = "logbook.contrib.adapters.copilot"
splitwise = "logbook.contrib.adapters.splitwise"
beeper = "logbook.contrib.adapters.beeper"
line = "logbook.contrib.adapters.line"
twitter = "logbook.contrib.adapters.twitter"
apple-books = "logbook.contrib.adapters.apple_books"
voice-memos = "logbook.contrib.adapters.voice_memos"
apple-photos = "logbook.contrib.adapters.apple_photos"
withings = "logbook.contrib.adapters.withings"
myfitnesspal = "logbook.contrib.adapters.myfitnesspal"
sbb = "logbook.contrib.adapters.sbb"
passages = "logbook.contrib.adapters.passages"
spotify = "logbook.contrib.adapters.spotify"
apple-music = "logbook.contrib.adapters.apple_music"
screentime = "logbook.contrib.adapters.screentime"
weather = "logbook.contrib.adapters.weather"

[dependency-groups]
dev = [
  "pre-commit>=4",
  "pytest>=8",
  "hypothesis>=6.168.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest-cov>=5",
  "pytest-xdist>=3.6",  # `pytest -n auto`, as CI runs the suite
  "jsonschema>=4",
  # the extras whose tests run and whose modules mypy sees (an in-process MCP client, a faked socket):
  # named once, under [project.optional-dependencies], never repeated here
  "openlogbook[crypto,sealed,ais,mcp,stream]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["logbook"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
allowed-confusables = ["×"]  # `×N sources`: a calendar entry several sources carry

[tool.mypy]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["ijson", "pyrage", "pyrage.*"]
ignore_missing_imports = true  # no py.typed, no stubs

[[tool.mypy.overrides]]
module = ["mlx_whisper.*", "faster_whisper.*", "huggingface_hub.*", "mlx_lm.*", "mlx_vlm.*", "pillow_heif.*"]
ignore_missing_imports = true  # the `transcribe`, `judge` and `describe` extras, imported only when the command runs

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --dist loadfile"  # with -n: a file's tests stay on one worker, so a module fixture builds once
markers = [
  "slow: takes more than about five seconds; skipped unless LOGBOOK_SLOW=1 (CI sets it on push to main and nightly, not on a pull request)",
  "stress: generated millions-of-lines tests with timing and memory assertions; skipped unless LOGBOOK_STRESS=1, never in CI",
]
# The 0.5 import paths (`logbook._shim`, `layout.MOVED`) warn once where they are imported, so the
# warning is attributed to the importing test, not to the shim: the filter matches its message. In
# the suite that warning is an error, and a test that drifts back to an old path fails on import
# (`scripts/rewrite_test_imports.py` moves it). The shims themselves, and a user's own code, still warn.
filterwarnings = [
  "error:^logbook\\.[a-z_.]+ is logbook\\.[a-z_.]+ since 0\\.6;:DeprecationWarning",
]
